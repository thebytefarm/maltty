# Shared review engine: thebytefarm/.github (review/README.md).
name: Pull review

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open pull request number
        required: true
        type: number
      publish:
        description: Publish one review and status rather than only an artifact
        default: false
        type: boolean

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: thebytefarm/.github/.github/workflows/pull-review.yml@e1ba85a421032865ae326526880a997c78cd4576
    with:
      engine-ref: e1ba85a421032865ae326526880a997c78cd4576
      pr-number: ${{ inputs.pr-number }}
      publish: ${{ inputs.publish }}
    secrets:
      SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
