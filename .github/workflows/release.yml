name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version
          title: 'release: version packages'
          commit: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # npm dist-tags are NOT corrected here. `maltty` has a non-prerelease
      # `0.0.0` on the registry, so changesets tags it `rc` (via preState.tag)
      # while tagging the prerelease-only `@maltty/*` packages `latest`,
      # splitting the group across two dist-tags on every release.
      #
      # Passing `--tag latest` to `changeset publish` does NOT fix this:
      # `publish()` hard-errors with "Releasing under custom tag is not allowed
      # in pre mode" before the tag is ever resolved. Unifying the tags means
      # `npm dist-tag` after publish, which needs a real token -- OIDC trusted
      # publishing only authenticates `npm publish`.
      #
      # Only the GitHub release is fixed up here: changesets marks it a
      # prerelease from the semver suffix, so `latest` stays on the older
      # stable. This runs on GITHUB_TOKEN and needs no npm credential.
      - name: Mark maltty release as GitHub Latest
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          version=$(echo "$PUBLISHED" | jq -r '.[] | select(.name == "maltty") | .version')
          if [ -n "$version" ]; then
            echo "Marking maltty@${version} as GitHub Latest"
            gh release edit "maltty@${version}" --prerelease=false --latest=true --repo "$GITHUB_REPOSITORY"
          fi
