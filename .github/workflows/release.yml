name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version
          title: 'release: version packages'
          commit: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # RCs are what users install today, so `pnpm release` passes
      # `--tag latest` to publish every package straight onto `latest` over
      # OIDC. That is deliberate: `maltty` has a non-prerelease `0.0.0` on the
      # registry, so changesets would otherwise tag it `rc` (via preState.tag)
      # while tagging the prerelease-only `@maltty/*` packages `latest`,
      # splitting the group across two dist-tags on every release.
      #
      # Only the GitHub release still needs fixing up: changesets marks it a
      # prerelease from the semver suffix, so `latest` stays on the older
      # stable. npm dist-tags are NOT touched here — OIDC trusted publishing
      # only authenticates `npm publish`, and the repo holds no npm token.
      - name: Mark maltty release as GitHub Latest
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          version=$(echo "$PUBLISHED" | jq -r '.[] | select(.name == "maltty") | .version')
          if [ -n "$version" ]; then
            echo "Marking maltty@${version} as GitHub Latest"
            gh release edit "maltty@${version}" --prerelease=false --latest=true --repo "$GITHUB_REPOSITORY"
          fi
